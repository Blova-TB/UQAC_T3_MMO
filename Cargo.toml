[workspace]
members = [
    "crates/shared",
    "crates/client",
    "crates/server",
    "crates/orchestrator",
    "crates/gateway"
]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Optimisation globale pour les builds en release (impacte tous les crates)
[profile.release]
opt-level = 3
lto = "thin"