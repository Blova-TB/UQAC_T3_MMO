[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
internal-communication-protocol = { path = "../../shared/internal-communication-protocol" }
network-protocol = { path = "../../shared/network-protocol" }
custom-id = { path = "../../shared/custom-id" }

redis = { version = "1.2.1", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
serde_json = "1.0.149"
bollard = "0.21.0"
uuid = { version = "1.23.1", features = ["v4"] }
anyhow = "1.0.102"
futures = "0.3.32"