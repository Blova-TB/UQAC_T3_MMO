[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
internal-communication-protocol = { path = "../../shared/internal-communication-protocol" }
network-protocol = { path = "../../shared/network-protocol" }
custom-id = { path = "../../shared/custom-id" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

redis = { version = "1.2.3", features = ["tokio-comp"] }
tokio = { version = "1.52.3", features = ["full"] }
bollard = "0.21.0"
uuid = { version = "1.23.3", features = ["v4"] }
anyhow = "1.0.102"
futures = "0.3.32"