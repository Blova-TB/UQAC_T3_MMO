[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2024"

[dependencies]
bcrypt = "0.19.1"
base64 = "0.22"
chrono = "0.4"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
rocket = { version = "0.5.1", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid"] }
redis = { version = "1.2.1", features = ["tokio-comp"] }
shared = { path = "../shared" }
anyhow = "1.0.102"
serde_json = "1.0.149"
tokio = "1.52.3"
