[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
internal-communication-protocol = { path = "../../shared/internal-communication-protocol" }
network-protocol = { path = "../../shared/network-protocol" }
custom-id = { path = "../../shared/custom-id" }

ahash = "0.8"
bytes = "1.5"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }