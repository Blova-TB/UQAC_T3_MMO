[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features] # cargo run -p server --features "dev"
dev = ["bevy/dynamic_linking"]

[dependencies]
client-communication-protocol = { path = "../../shared/client-communication-protocol" }
internal-communication-protocol = { path = "../../shared/internal-communication-protocol" }
network-protocol = { path = "../../shared/network-protocol" }
custom-id = { path = "../../shared/custom-id" }

bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_log",
    "debug",
    "bevy_state"
] }
avian2d = "0.6"
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
bitcode = "0.6"
serde_json = "1.0.149"
rand = "0.9.4"
mathtools = "0.1.0"
