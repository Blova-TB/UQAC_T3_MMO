[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features] # cargo run -p server --features "dev"
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_log",
    "debug",
    "bevy_state"
] }
avian2d = "0.6"
shared = { path = "../shared" }
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
bitcode = "0.6"
uuid = { version = "1.23.1", features = ["v4"] }
serde_json = "1.0.149"
rand = "0.9.4"

