<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Voronoi MMO Dashboard</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #16213e; border: 2px solid #0f3460; box-shadow: 0 0 20px rgba(0,0,0,0.5); margin-top: 20px;}
        #status { color: #e94560; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<h2>🚀 Visualiseur Live - Voronoi Sharding</h2>
<div id="status">
    <span id="conn-state" style="color: #e94560;">● Déconnecté</span> |
    <span id="player-count">0</span> joueurs |
    <span id="shard-count">0</span> shards
</div>

<canvas id="map" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');

    // Palette de base pour les shards
    const PALETTE = [
        '#f44336', '#4caf50', '#2196f3', '#e91e63', '#ff9800',
        '#ffeb3b', '#388e3c', '#9c27b0', '#e91e63', '#03a9f4'
    ];

    // Convertit un ID ("1v1") en couleur constante
    function getColor(idStr) {
        let hash = 0;
        for(let i=0; i<idStr.length; i++) hash += idStr.charCodeAt(i);
        return PALETTE[hash % PALETTE.length];
    }

    // Ajoute de l'opacité à une couleur HEX
    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function updateMap() {
        try {
            const response = await fetch('http://localhost:8080');
            const state = await response.json();

            document.getElementById('conn-state').innerText = "● Connecté";
            document.getElementById('conn-state').style.color = "#4caf50";
            document.getElementById('player-count').innerText = state.players?.length || 0;
            document.getElementById('shard-count').innerText = state.shards?.length || 0;

            render(state);
        } catch (e) {
            document.getElementById('conn-state').innerText = "● Serveur injoignable";
            document.getElementById('conn-state').style.color = "#e94560";
        }
    }
    setInterval(updateMap, 100);

    function render(state) {
        if (!state.map_width) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const scaleX = canvas.width / state.map_width;
        const scaleY = canvas.height / state.map_height;

        // 1. Dessiner les Polygones de Voronoï (Fond)
        if (state.polygons) {
            state.polygons.forEach(poly => {
                if(poly.vertices.length < 3) return;

                const baseColor = getColor(poly.shard_id);

                ctx.beginPath();
                poly.vertices.forEach((v, index) => {
                    const vx = v.x * scaleX;
                    const vy = v.y * scaleY;
                    if (index === 0) ctx.moveTo(vx, vy);
                    else ctx.lineTo(vx, vy);
                });
                ctx.closePath();

                // Remplissage transparent
                ctx.fillStyle = hexToRgba(baseColor, 0.3);
                ctx.fill();
                // Bordure solide
                ctx.strokeStyle = baseColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // 2. Dessiner les Ghost AABBs (Zone d'Interest Management)
        if (state.ghost_aabbs) {
            state.ghost_aabbs.forEach(aabb => {
                const baseColor = getColor(aabb.shard_id);
                const x = aabb.min_x * scaleX;
                const y = aabb.min_y * scaleY;
                const w = (aabb.max_x - aabb.min_x) * scaleX;
                const h = (aabb.max_y - aabb.min_y) * scaleY;

                ctx.strokeStyle = hexToRgba(baseColor, 0.8);
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]); // Ligne pointillée
                ctx.strokeRect(x, y, w, h);
                ctx.setLineDash([]); // Reset
            });
        }

        // 3. Dessiner les Centres des Shards
        if (state.shards) {
            state.shards.forEach(shard => {
                const sx = shard.x * scaleX;
                const sy = shard.y * scaleY;

                ctx.beginPath();
                ctx.arc(sx, sy, 8, 0, Math.PI * 2);
                ctx.fillStyle = getColor(shard.id);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // 4. Dessiner les Joueurs
        if (state.players) {
            state.players.forEach(player => {
                const px = player.x * scaleX;
                const py = player.y * scaleY;

                ctx.beginPath();
                ctx.arc(px, py, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = getColor(player.shard_id);
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }
    }
</script>
</body>
</html>
