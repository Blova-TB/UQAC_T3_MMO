version: '3.8'

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestrator.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379/
    depends_on:
      - redis
    networks:
      - game-network
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "3000:3000"
    networks:
      - game-network
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
  # Le server n'est pas instancié ici, l'orchestrateur le fera via l'API Docker.