version: '3.8'

services:
  dbgate:
    image: dbgate/dbgate
    ports:
      - "8081:3000"
    networks:
      - game-network
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mmo_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gatekeeper_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crates/gatekeeper/migrations/0001_users_table.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - game-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mmo_admin -d gatekeeper_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestrator.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379/
    depends_on:
      - redis
    networks:
      - game-network
  gatekeeper:
    build:
      context: ..
      dockerfile: docker/gatekeeper.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://mmo_admin:password123@db:5432/gatekeeper_db
      - RUST_LOG=info
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=3000
    networks:
      - game-network
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
  # Le server n'est pas instancié ici, l'orchestrateur le fera via l'API Docker.

volumes:
  postgres_data: