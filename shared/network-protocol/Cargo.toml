[package]
name = "network-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1.23.3", features = ["v4"] }
quinn = { version = "0.10" }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tracing = "0.1.44"
futures = "0.3.32"
rcgen = "0.11"